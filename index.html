        /* ========== GAS CYLINDER CONTAINER ========== */
        .gas-cylinder {
        display: flex;
        flex-direction: column;
        align-items: center; /* horizontally center the top/body/base */
        width: 60px;
        height: 90px;
        margin-left: 20px;
        margin-right: 20px;
        }

        /* ========== TOP (the elliptical "cap") ========== */
        .tank-top {
        width: 24px;
        height: 25px;
        border-radius: 5px 5px 0 0; /* elliptical top */

        /* Metallic radial gradient for a 3D effect */
        background: radial-gradient(circle at 50% 30%,
                    #bbb 0%,
                    #999 40%,
                    #777 80%,
                    #666 100%);
        box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
        }

        /* ========== BODY (middle container) ========== */
        .tank-body {
        width: 50px;
        height: 200px;
        border-radius: 15px; /* fully rounded sides */

        /* Another radial gradient for the cylinder body */
        background: radial-gradient(circle at 50% 30%,
                    #bbb 0%,
                    #999 40%,
                    #777 80%,
                    #666 100%);
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5);

        /* We allow the fill to be absolutely positioned inside */
        position: relative;
        overflow: hidden; /* to clip the fill’s top edges */
        }

        /* The fill gradient inside the body */
        .lpg-level {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        /* default fill ~ 50%, overridden in JS */
        height: 5%;
        /* Liquid/gas gradient */
        background: linear-gradient(to top,
                    #1af 0%,
                    #2df 50%,
                    #5ff 100%);
        transition: height 0.3s;
        /* Keep bottom corners round to match cylinder shape */
        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
        }

        /* A wave shape at the top of .lpg-level */
        .lpg-level::after {
            content: "";
            position: absolute;
            top: -19px;
            left: 0;
            right: 0;
            height: 30px;
            width: 100%;
            background: url("data:image/svg+xml;utf8, <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 13'><path d='M0,20 C30,0 70,40 100,20 L100,0 L0,0 Z' fill='%232DF' /></svg>") no-repeat center;
            background-size: 100% 100%;
            animation: animate 3s ease-in-out infinite;
            border-radius: 10px;
        }

        /* ========== BASE (the bottom ring/stand) ========== */
        .tank-base {
        width: 28px;
        height: 10px;
        border-radius: 0 0 3px 3px; /* elliptical bottom */

        background: radial-gradient(circle at 50% 70%,
                    #bbb 0%,
                    #999 40%,
                    #777 80%,
                    #666 100%);
        box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
        }

        @keyframes animate {
            0%,
            100% {
                clip-path: polygon(
                    0% 45%,
                    16% 44%,
                    33% 50%,
                    54% 60%,
                    70% 61%,
                    84% 59%,
                    100% 52%,
                    100% 100%,
                    0% 100%
                );
            }

            50% {
                clip-path: polygon(
                    0% 60%,
                    15% 65%,
                    34% 66%,
                    51% 62%,
                    67% 50%,
                    84% 45%,
                    100% 46%,
                    100% 100%,
                    0% 100%
                );
            }
        }

        // BLE UUIDs (as you already had)
        const BLE_SERVICE = '0000181a-0000-1000-8000-00805f9b34fb'.toLowerCase();
        const NOTIFY_CHAR  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'.toLowerCase(); // TX – notifications
        const WRITE_CHAR   = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'.toLowerCase(); // RX – write commands

        let device, server, service, notifyChar, writeChar;

        connectBtn.addEventListener('click', connectBLE);
        disconnectBtn.addEventListener('click', disconnectBLE);
        sendWifiBtn.addEventListener('click', sendWiFiViaBLE);

        connectBtn.style.display = 'block';
        disconnectBtn.style.display = 'none';

        function connectBLE() {
            if (!navigator.bluetooth) {
                alert("Web Bluetooth not supported in this browser.");
                return;
            }

            navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'BURDVA GM-' }],
                optionalServices: [BLE_SERVICE]
            })
            .then(d => {
                device = d;
                bleState.textContent = 'Connecting...';
                bleState.style.color = '#ff9800';
                return device.gatt.connect();
            })
            .then(s => {
                server = s;
                bleState.textContent = 'Connected';
                bleState.style.color = '#24af37';
                disconnectBtn.style.display = 'block';
                connectBtn.style.display = 'none';
                return server.getPrimaryService(BLE_SERVICE);
            })
            .then(s => {
                service = s;
                return Promise.all([
                    service.getCharacteristic(NOTIFY_CHAR),
                    service.getCharacteristic(WRITE_CHAR)
                ]);
            })
            .then(chars => {
                [notifyChar, writeChar] = chars;

                notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', handleNotification);

                // Request first reading immediately
                notifyChar.readValue().then(handleNotification);
            })
            .catch(err => {
                console.error(err);
                disconnectBtn.style.display = 'block';
                bleState.textContent = 'Error';
                bleState.style.color = '#d13a30';
            });
        }

        function disconnectBLE() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
            disconnectBtn.style.display = 'none';
            connectBtn.style.display = 'block';
            bleState.textContent = 'Disconnected';
            bleState.style.color = '#d13a30';
        }

        function handleNotification(event) {
            const rawBytes = event.target.value;
            const rawText = new TextDecoder().decode(rawBytes);

            // --- ROBUST JSON EXTRACTOR (handles , \r, \n, garbage, etc.) ---
            const jsonStart = rawText.indexOf('{');
            const jsonEnd   = rawText.lastIndexOf('}') + 1;

            if (jsonStart === -1 || jsonEnd === 0) {
                console.log("No JSON found in:", rawText);
                return;
            }

            const cleanJsonString = rawText.substring(jsonStart, jsonEnd);

            try {
                const data = JSON.parse(cleanJsonString);

                // Now safely update the UI
                document.getElementById('sensorId').textContent      = data.sid  || '—';
                document.getElementById('temperature').textContent   = (data.temp || '0') + '°C';
                document.getElementById('angle').textContent         = (data.angle || '0') + '°';
                document.getElementById('signalStrength').textContent= (data.signal || '0') + ' mV';

                const percentage = parseFloat(data.value) || 0;

                document.getElementById('percentageFull').textContent = percentage + ' %';
                document.getElementById('lpgLevel').style.height      = percentage + '%';

                // WiFi status
                // const ip = data.ip || '';
                // document.getElementById('networtStatus').textContent =
                //     (ip && ip !== '0.0.0.0' && ip !== '192.168.4.1')
                //         ? 'Connected (' + ip + ')'
                //         : 'Not connected';
                //
                // console.log("Parsed JSON:", data);
            } catch (e) {
                console.error("JSON parse failed on:", cleanJsonString, e);
            }
        }

        // Send WiFi credentials as plain text: SSID:Password
        function sendWiFiViaBLE() {
            const ssid = document.getElementById('wifiSsid').value.trim();
            const pass = document.getElementById('wifiPass').value;

            if (!ssid) {
                wifiFeedback.textContent = "Please enter SSID";
                wifiFeedback.style.color = 'red';
                return;
            }

            if (!writeChar) {
                wifiFeedback.textContent = "BLE not connected";
                wifiFeedback.style.color = 'red';
                return;
            }

            const command = `WIFI:${ssid}:${pass}`;
            const encoder = new TextEncoder();
            writeChar.writeValue(encoder.encode(command))
                .then(() => {
                    wifiFeedback.textContent = "WiFi credentials sent!";
                    wifiFeedback.style.color = 'green';
                    setTimeout(() => wifiFeedback.textContent = '', 4000);
                })
                .catch(err => {
                    wifiFeedback.textContent = "Failed to send";
                    wifiFeedback.style.color = 'red';
                    console.error(err);
                });
        }

        // Auto-reconnect on disconnect (optional)
        if (navigator.bluetooth) {
            navigator.bluetooth.addEventListener('disconnection', () => {
                bleState.textContent = 'Disconnected';
                bleState.style.color = '#d13a30';
            });
        }

        window.addEventListener('beforeunload', function (event) {
            // Your function logic here (e.g., logging some data)
            console.log("Page is about to unload");
            disconnectBLE();
        });

    </script>
</body>
